<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HTML Registration Form</title>
<style>
body {
  font-family: Arial, sans-serif; /* Fixed typo: san-serif -> sans-serif */
  margin: 0;
  padding: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background-color: #f4f4f4; /* Added background color to see the form container clearly */
}
.main { /* Changed 'main' selector to '.main' class to match your HTML container */
  background-color: #fff;
  border-radius: 15px; /* Fixed typo: border radius -> border-radius */
  box-shadow: 0 0 20px rgba(0,0,0,0.2);
  padding: 20px;
  width: 300px;
}
.main h2 {
  color: #4caf50;
  margin-bottom: 20px;
  margin-top: 0; /* Reset top margin for better spacing */
}
label {
  display: block;
  margin-bottom: 5px;
  color: #555;
  font-weight: bold;
}
input[type="text"],
input[type="email"],
input[type="password"],
select {
  width: 100%;
  margin-bottom: 15px;
  padding: 10px;
  box-sizing: border-box;
  border-radius: 5px;
  border: 1px solid #ccc; /* Added border to make inputs visible */
}
button[type="submit"] {
  width: 100%; /* Stretches button to fit form width */
  padding: 15px;
  border-radius: 10px;
  background-color: #4caf50;
  color: white;
  cursor: pointer;
  font-size: 16px;
  border: none; /* Removes default button borders */
}
button[type="submit"]:hover {
  background-color: #45a049; /* Added hover effect for better user experience */
}
</style>
</head>
<body>
<div class="main">
  <h2>Registration Form</h2>
  <form action="">
    <label for="first">First Name:</label>
    <input type="text" id="first" name="first" required/>
    
    <label for="last">Last Name:</label>
    <input type="text" id="last" name="last" required/>
    
    <label for="email">Email:</label>
    <input type="type" id="email" name="email" required/>
    
    <label for="password">Password:</label>
    <input type="password" id="password" name="password" 
           pattern="^(?=.*\d)(?=.*[A-Za-z])(?=.*[^A-Za-z0-9]).{8,}$" 
           title="Password must contain at least one number, one alphabet, one symbol, and be at least 8 characters long" 
           required/>
    
    <label for="repassword">Retype password:</label>
    <input type="password" id="repassword" name="repassword" required/>
    
    <button type="submit">Register</button>
  </form>
</div>
</body>
</html>
